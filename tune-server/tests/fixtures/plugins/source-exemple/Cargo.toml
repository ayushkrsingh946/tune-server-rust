# #6197 — le greffon d'exemple « source de streaming ». Hors de l'espace de
# travail du serveur (table `[workspace]` vide) : il se compile seul, vers
# `wasm32-unknown-unknown`, et seul son `main.wasm` sert aux tests.
#
#   cargo build --release --target wasm32-unknown-unknown
#   cp target/wasm32-unknown-unknown/release/source_exemple.wasm main.wasm
[package]
name = "source-exemple"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies]
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
panic = "abort"
strip = true
