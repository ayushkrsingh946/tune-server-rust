[package]
name = "tune-bridge"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Tune Bridge — cloud relay for remote access to Tune servers"

[[bin]]
name = "tune-bridge"
path = "src/main.rs"

[dependencies]
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
time = { workspace = true }
uuid = { workspace = true }
axum = { workspace = true }
tower-http = { workspace = true }
futures-util = { workspace = true }
bytes = { workspace = true }
dashmap = "6"
reqwest = { workspace = true }
dotenvy = { workspace = true }

[dev-dependencies]
tempfile = "3"
# #6564 : un faux serveur Tune sur une vraie WebSocket, et l'ancien format
# base64, dans les tests de bout en bout du pont.
tokio-tungstenite = "0.26"
base64 = "0.22"
